syntax = "proto3";
package raft;

option go_package = "github.com/your-username/DistributedDatabaseSystem/proto/raft;raftpb";

service RaftService {
    rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
    rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}

message RequestVoteRequest {
    uint64 term = 1;
    uint64 candidate_id = 2;
    uint64 last_log_index = 3;
    uint64 last_log_term = 4;
}

message RequestVoteResponse {
    uint64 term = 1;
    bool vote_granted = 2;
}

message AppendEntriesRequest {
    uint64 term = 1;
    uint64 leader_id = 2;
    uint64 prev_log_index = 3;
    uint64 prev_log_term = 4;
    repeated RaftLogEntry entries = 5;
    uint64 leader_commit = 6;
}

message AppendEntriesResponse {
    uint64 term = 1;
    bool success = 2;
}

message FieldList {
    uint32 elem_type = 1;
    repeated FieldValue elems = 2;
}

message FieldValue {
    uint32 tag = 5;
    oneof value {
        int64 int_value = 1;
        string string_value = 2;
        bool bool_value = 3;
        FieldList list_value = 4;
    }
}

message RaftLogEntry {
    uint64 index = 1;
    uint64 term = 2;
    int32 op = 3;
    uint64 key = 4;
    repeated FieldValue fields = 5;
}
